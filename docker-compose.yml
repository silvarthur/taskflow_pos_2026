# =============================================================================
# docker-compose.insecure.yml - VERSAO INSEGURA usada no inicio do Encontro 11.
#
# Objetivo didatico: subir a aplicacao TaskFlow (app-exemplo/) junto de um
# banco de dados, do jeito "mais rapido possivel", sem pensar em seguranca.
# Cada comentario "# FALHA" marca uma pratica ruim que sera corrigida,
# passo a passo, na aula, ate chegar em docker-compose.secure.yml.
#
# NAO use este arquivo como referencia. Ele existe apenas para comparacao
# lado a lado com a versao corrigida.
#
# NOTA SOBRE O BANCO DE DADOS: a aplicacao TaskFlow real (app-exemplo/app.py)
# usa SQLite embutido (arquivo taskflow.db), sem servidor de banco separado.
# Para fins didaticos de Docker Compose - que so faz sentido demonstrar
# orquestrando MULTIPLOS servicos - vamos simular aqui como se o TaskFlow
# usasse um PostgreSQL externo (servico "db"). Isso e comum em aplicacoes
# Flask reais e permite ensinar os conceitos de rede, secrets e dependencia
# entre containers que o SQLite sozinho nao ilustraria. Nao se preocupe:
# o container "db" sobe normalmente, mesmo que o app.py desta versao do
# curso ainda nao esteja lendo essa variavel de conexao - o foco aqui e
# a ORQUESTRACAO seguro, nao a migracao do app para Postgres.
# =============================================================================

version: "3.9"

services:
  web:
    build:
#      context: ../../
      dockerfile: Dockerfile
    image: taskflow:compose-secure
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TASKFLOW_SECRET_KEY=${SECRET_KEY}
    # FALHA 3: nenhuma definicao de "networks" - o Compose cria uma rede
    # padrao unica e coloca TODOS os servicos nela. Isso significa que,
    # se amanha adicionarmos um terceiro servico (por exemplo, um painel
    # de administracao interno), ele teria acesso de rede irrestrito tanto
    # ao "web" quanto ao "db", mesmo sem nenhuma necessidade de conversar
    # com o banco diretamente.
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp
      - /app/.gunicorn
    # FALHA 4: nenhum "healthcheck" definido - o Compose nao tem como saber
    # se a aplicacao subiu corretamente ou travou; ela e considerada "up"
    # assim que o processo do container inicia, mesmo que o Flask tenha
    # crashado logo em seguida.
    #
    # FALHA 5: nenhum limite de recursos (deploy.resources.limits) - um bug
    # ou um ataque de esgotamento de recursos (DoS local) dentro deste
    # container pode consumir toda a CPU/memoria disponivel do host,
    # afetando o container "db" e qualquer outra coisa rodando na maquina.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    security_opt:
      - no-new-privileges:true
    environment:
      # FALHA 2 (repetida aqui): mesma senha hardcoded, agora do lado do
      # servidor de banco de dados.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - backend
    volumes:
      - taskflow_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    # FALHA 7: sem "read_only", sem "healthcheck", sem limite de recursos -
    # os mesmos problemas do servico "web" se repetem aqui.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  # FALHA 8 (bonus - discutir em aula, nao incluido como servico ativo):
  # e comum encontrar, em exemplos inseguros "de producao" reais, um
  # servico de monitoramento ou CI local montando o socket do Docker do
  # host assim:
  #
  #   monitor:
  #     image: algum-painel-de-monitoramento
  #     volumes:
  #       - /var/run/docker.sock:/var/run/docker.sock
  #
  # Isso equivale a dar controle root da maquina host para dentro do
  # container - qualquer vulnerabilidade nesse "painel" vira uma
  # vulnerabilidade no host inteiro. Vamos discutir esse ponto na teoria,
  # sem materializar o servico aqui.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false  

volumes:
  taskflow_db_data: