# Stack de observabilidade do Modulo 6: Loki + Promtail + Grafana.
#
# Como usar (a app sobe PRIMEIRO, porque e ela que cria o volume de logs):
#   1. Na raiz do repositorio:   docker compose up -d --build --wait
#   2. cp observabilidade/.env.example observabilidade/.env  (e preencher)
#   3. Na raiz do repositorio:   docker compose -f observabilidade/docker-compose.yml up -d
#   4. Grafana em http://localhost:3000 (usuario e senha do observabilidade/.env)
#
# Fluxo dos logs:
#   web (grava JSON em /app/logs) -> volume taskflow_logs -> promtail (le :ro)
#   -> loki (armazena) -> grafana (consulta com LogQL)
#
# Hardening (mesmos principios do Modulo 5): imagens com versao fixa,
# portas publicadas apenas em 127.0.0.1, no-new-privileges, limites de CPU e
# memoria, rede propria e nenhum acesso ao docker.sock.

name: taskflow-observabilidade

services:
  loki:
    image: grafana/loki:2.9.6
    container_name: taskflow-loki
    command: -config.file=/etc/loki/local-config.yaml
    # API do Loki publicada so em localhost (a referencia publica em todas as
    # interfaces); Grafana e Promtail o acessam pela rede interna.
    ports:
      - "127.0.0.1:3100:3100"
    security_opt:
      - no-new-privileges:true
    networks:
      - observabilidade
    # Os dados ficam em /tmp/loki dentro do container (config padrao da imagem):
    # em laboratorio, recriar o container zera os logs, o que e aceitavel.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.6
    container_name: taskflow-promtail
    command: -config.file=/etc/promtail/config.yml
    security_opt:
      - no-new-privileges:true
    networks:
      - observabilidade
    volumes:
      - taskflow_logs:/var/log/taskflow:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.2
    container_name: taskflow-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Credenciais vem do observabilidade/.env (nao versionado).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    security_opt:
      - no-new-privileges:true
    networks:
      - observabilidade
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      loki:
        condition: service_healthy

networks:
  observabilidade:
    driver: bridge

volumes:
  grafana_data:
  # Criado pelo docker-compose.yml da raiz (nome fixo "taskflow_logs").
  taskflow_logs:
    external: true
